[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "combat-balance-portfolio"
version = "1.0.0"
description = "实时制 PvE 战斗数值模拟、分析与自动调参工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.18",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "streamlit>=1.32",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
combat-balance = "combat_balance.cli:main"

[tool.setuptools.packages.find]
include = ["combat_balance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
