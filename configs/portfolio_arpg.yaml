study:
  level_checkpoints: [1, 10, 20, 30, 40, 50]
  report_runs: 1000
  default_player: vanguard
  default_enemy: elite
  default_policy: priority
  targets:
    - {enemy_id: common, ttk_min: 8, ttk_max: 12, win_rate_min: 0.95, win_rate_max: 1.0}
    - {enemy_id: elite, ttk_min: 25, ttk_max: 35, win_rate_min: 0.70, win_rate_max: 0.85}
    - {enemy_id: boss, ttk_min: 90, ttk_max: 120, win_rate_min: 0.45, win_rate_max: 0.60}

optimization:
  levels: [30]
  stage1_candidates: 512
  stage1_runs: 300
  stage2_candidates: 256
  stage2_runs: 1000
  final_runs: 10000
  parameters:
    - {path: players.vanguard.stats.attack, minimum: 62, maximum: 74}
    - {path: players.vanguard.skills.1.multiplier, minimum: 2.3, maximum: 3.1}
    - {path: players.ranger.skills.1.multiplier, minimum: 1.5, maximum: 2.2}
    - {path: players.arcanist.stats.attack, minimum: 65, maximum: 76}
    - {path: players.arcanist.skills.1.multiplier, minimum: 2.0, maximum: 3.0}
    - {path: enemies.common.stats.hp, minimum: 560, maximum: 680}
    - {path: enemies.elite.stats.hp, minimum: 1450, maximum: 1750}
    - {path: enemies.elite.stats.attack, minimum: 55, maximum: 75}
    - {path: enemies.boss.stats.hp, minimum: 4700, maximum: 5600}
    - {path: enemies.boss.stats.attack, minimum: 36, maximum: 45}
