name: 余烬前线：实时 PvE 战斗平衡研究
version: "1.0"

formula:
  defense_k_base: 100
  defense_k_per_level: 10
  max_time: 150
  max_events: 10000

policies:
  priority:
    id: priority
    name: 固定优先级
    kind: priority
    priority:
      - battle_focus
      - arcane_surge
      - rapid_focus
      - shield_wall
      - evasive_step
      - frost_barrier
      - execution_slash
      - aimed_shot
      - meteor
      - whirlwind
      - rapid_fire
      - fireball
      - power_strike
      - piercing_arrow
      - arcane_bolt
      - crushing_blow
      - venom_spit
      - shadow_bolt
      - monster_attack
      - basic_attack
  burst:
    id: burst
    name: 爆发对齐
    kind: burst
    priority:
      - battle_focus
      - arcane_surge
      - rapid_focus
      - execution_slash
      - aimed_shot
      - meteor
      - whirlwind
      - rapid_fire
      - fireball
      - power_strike
      - piercing_arrow
      - arcane_bolt
      - shield_wall
      - evasive_step
      - frost_barrier
      - basic_attack
    burst_tags: [burst]
    hold_window: 1.5
  conservative:
    id: conservative
    name: 保守生存
    kind: conservative
    priority:
      - shield_wall
      - evasive_step
      - frost_barrier
      - battle_focus
      - rapid_focus
      - arcane_surge
      - execution_slash
      - aimed_shot
      - meteor
      - whirlwind
      - rapid_fire
      - fireball
      - power_strike
      - piercing_arrow
      - arcane_bolt
      - basic_attack
    hp_threshold: 0.4
    resource_floor: 0.2

